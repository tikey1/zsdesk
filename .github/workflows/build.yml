name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # —— 沿用上游 zsdesk build.yml ——
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  # CI 里的 git 一律不交互：否则遇到认证提示会挂死到超时
  GIT_TERMINAL_PROMPT: '0'
  GIT_ASKPASS: 'echo'

jobs:
  # ==================================================================
  # rust：Rust 编译 / 测试 / 门禁。**不依赖 core-ui** ——
  # Rust 侧对 core-ui 采用运行时 LoadLibrary 动态加载（D09），
  # 不链接 core-ui.lib，因此 core-ui 的 C++ 构建失败不会阻塞 Rust。
  # ==================================================================
  rust:
    name: Rust 编译 / 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: app

      - name: Read the pinned ZSUI revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath app/packaging/zsui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'

      # zsui 必须与 app 同级：crates/<name>/Cargo.toml 里的 path 依赖是 ../../../zsui
      - uses: actions/checkout@v7
        with:
          repository: qiu7824/zsui
          ref: ${{ steps.dependency.outputs.revision }}
          path: zsui

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Test
        working-directory: app
        run: cargo test --workspace --release --locked

      # D05：唯一交付形态 = full edition（features network + desktop = default）
      - name: Build the full edition (x64)
        working-directory: app
        shell: pwsh
        run: |
          cargo build --locked --release -p zsdesk-app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          exit 0

      # 上游 CI 未启用 clippy，先作观察项；告警清零后再改为 -D warnings 强制门禁
      - name: Clippy (advisory)
        working-directory: app
        continue-on-error: true
        run: cargo clippy --locked --release -p zsdesk-app

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: zsdesk-app-full-x64
          path: app/target/release/zsdesk-app.exe
          if-no-files-found: error

  # ==================================================================
  # core-ui：从钉住的 revision 从源码构建（clang-cl + Ninja + llvm-rc）
  # ==================================================================
  core-ui:
    name: core-ui 源码构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: app

      - name: Read the pinned core-ui revision
        id: dependency
        shell: pwsh
        run: '"revision=$((Get-Content -LiteralPath app/packaging/core-ui-revision.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT'

      - uses: actions/checkout@v7
        with:
          repository: ghboke/core-ui
          ref: ${{ steps.dependency.outputs.revision }}
          path: core-ui

      # 导入 MSVC x64 开发环境（INCLUDE / LIB / PATH）。
      # 不再依赖上游 build-clang-cl.ps1 自带的 vcvars 导入逻辑 —— 那个 cmd.exe 包裹的
      # 环境块抓取在 CI 上不稳定，且脚本不透传额外 cmake 参数。
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate clang-cl and llvm-rc
        id: toolchain
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\LLVM\bin\clang-cl.exe',
            'C:\Program Files (x86)\LLVM\bin\clang-cl.exe'
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path -LiteralPath $c) { $found = $c; break }
          }
          if (-not $found) {
            $cmd = Get-Command clang-cl -ErrorAction SilentlyContinue
            if ($cmd) { $found = $cmd.Source }
          }
          if (-not $found) {
            throw 'clang-cl not found. Install LLVM, or pass -ClangClPath to build-clang-cl.ps1.'
          }
          $rc = Join-Path (Split-Path -Parent $found) 'llvm-rc.exe'
          if (-not (Test-Path -LiteralPath $rc)) {
            # 上游脚本只在 llvm-rc 与 clang-cl 同目录时才覆盖 CMAKE_RC_COMPILER。
            # Windows SDK 的 rc.exe (10.0.26100) 在部分 ninja 子进程会挂起，
            # 因此 llvm-rc 缺失必须显式失败，不能静默退回 rc.exe。
            throw "llvm-rc.exe not found next to $found — the build would hang in rc.exe. Install LLVM with llvm-rc."
          }
          "path=$found" >> $env:GITHUB_OUTPUT
          "rc=$rc"     >> $env:GITHUB_OUTPUT
          Write-Host "clang-cl: $found"
          Write-Host "llvm-rc  : $rc"

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
            Write-Host "ninja already available: $((Get-Command ninja).Source)"
            exit 0
          }
          python -m pip install --upgrade ninja
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            throw 'ninja is still not on PATH after pip install'
          }
          Write-Host "ninja installed: $((Get-Command ninja).Source)"

      # 上游脚本的 $needsConfigure = -not (Test-Path CMakeCache.txt)：
      # 一旦 clang-cl-build/ 里有旧的 CMakeCache.txt 就会跳过 configure，
      # 编出旧配置的产物。CI 每次全新 checkout 不会命中，但必须显式清干净。
      - name: Clean the build directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'core-ui\clang-cl-build'
          if (Test-Path -LiteralPath $dir) {
            Remove-Item -LiteralPath $dir -Recurse -Force
            Write-Host "removed stale build dir: $dir"
          } else {
            Write-Host 'no stale build dir'
          }

      # core-ui 的 CMakeLists 用 FetchContent 从 GitHub 现场拉 QuickJS-NG：
      #   FetchContent_Declare(quickjs GIT_REPOSITORY https://github.com/quickjs-ng/quickjs.git
      #                         GIT_TAG v0.14.0 GIT_SHALLOW TRUE)
      # 这里预置该源码到 FetchContent 的默认落点 _deps/quickjs-src，
      # 让 configure 直接复用、不再联网 —— 消除浅克隆 tag / 子模块 / 认证挂死风险。
      # 预置失败不阻断：让上游脚本自己走 FetchContent 下载路径。
      # core-ui 的 CMakeLists 用 FetchContent 从 GitHub 现场拉 QuickJS-NG：
      #   FetchContent_Declare(quickjs GIT_REPOSITORY .../quickjs.git GIT_TAG v0.14.0 GIT_SHALLOW TRUE)
      #
      # 注意：把源码预置到 _deps/quickjs-src **无效** —— FetchContent 是否需要下载，
      # 由 _deps/quickjs-subbuild/quickjs-populate-prefix/src/quickjs-populate-stamp/
      # 下的 stamp 决定；CI 每次删掉整个 clang-cl-build/（正是为了避免 stale CMakeCache.txt），
      # stamp 一并被删 → FetchContent 判定「未下载过」→ 重新 clone → 预置白做。
      # 正确做法是 CMake 官方覆盖变量：设了它 FetchContent 完全跳过 download。
      #
      # 不加 --recurse-submodules：quickjs-ng v0.14.0 的 .gitmodules 只有一个
      # test262 子模块且 update = none（JS 引擎的测试套件，构建不需要），
      # 递归克隆会额外拉一个体量极大的仓库。
      - name: Pre-fetch QuickJS-NG
        id: quickjs
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'quickjs'
          git clone --depth 1 --branch v0.14.0 https://github.com/quickjs-ng/quickjs.git $dest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $dest 'CMakeLists.txt'))) {
            throw 'pre-fetched QuickJS-NG has no CMakeLists.txt'
          }
          "dir=$dest" >> $env:GITHUB_OUTPUT
          Write-Host "QuickJS-NG pre-fetched into $dest"

      # 上游 scripts/build-clang-cl.ps1 的 cmake 参数原样照抄，只额外加一个
      # -DFETCHCONTENT_SOURCE_DIR_QUICKJS（脚本不透传额外 -D，这是 CMake 官方机制）。
      # 契约约束的是「构建结果」，不是「调用哪个脚本」（见 spec/ci-contract.md §5）。
      # MSVC 环境由 ilammy/msvc-dev-cmd 导入，不再依赖脚本自带的 vcvars 导入逻辑。
      - name: Configure and build core-ui from source
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'core-ui-build.log'
          $src  = Join-Path $env:GITHUB_WORKSPACE 'core-ui'
          $bld  = Join-Path $src 'clang-cl-build'
          $clang = "${{ steps.toolchain.outputs.path }}"
          $rc    = "${{ steps.toolchain.outputs.rc }}"
          $qjs   = "${{ steps.quickjs.outputs.dir }}"
          $clangFwd = ($clang -replace '\\','/')
          $rcFwd    = ($rc    -replace '\\','/')
          $failed = $false
          try {
            & cmake -S $src -B $bld -G Ninja `
                "-DCMAKE_BUILD_TYPE=Release" `
                "-DCMAKE_C_COMPILER=$clangFwd" `
                "-DCMAKE_CXX_COMPILER=$clangFwd" `
                "-DCMAKE_RC_COMPILER=$rcFwd" `
                "-DFETCHCONTENT_SOURCE_DIR_QUICKJS=$qjs" *>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($LASTEXITCODE)" }
            & cmake --build $bld --target core-ui *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "cmake build failed ($LASTEXITCODE)" }
          } catch {
            $detail = ($_ | Out-String)
            $detail | Tee-Object -FilePath $log -Append | Write-Host
            # 用 workflow command 把原始异常变成 check-run annotation：
            # run 级日志 API 需要 admin 权限，外部取不到；annotation 可经公开 API 读到。
            $flat = ($detail -replace "`r`n", '%0A' -replace '%', '%25')
            Write-Host "::error title=core-ui build failed::$flat"
            $failed = $true
          }
          # 把日志尾部也做成 annotation，便于直接定位首个真实报错
          if (Test-Path -LiteralPath $log) {
            $tail = (Get-Content -LiteralPath $log -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
            if ($tail) {
              $flatTail = ($tail -replace "`r`n", '%0A' -replace '%', '%25')
              Write-Host "::error title=core-ui build log (tail 40)::$flatTail"
            }
          }
          # 日志尾部同时写进 step summary，网页上直接可见，不必展开日志
          if (Test-Path -LiteralPath $log) {
            $tail = Get-Content -LiteralPath $log -Tail 60 -ErrorAction SilentlyContinue
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## core-ui 构建日志（末尾 60 行）`n`n```" -Encoding utf8
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($tail -join "`n") -Encoding utf8
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "```" -Encoding utf8
          }
          if ($failed) { throw 'core-ui build failed — see the log artifact' }

      # 日志无论成败都上传（run 级日志 API 需要 admin 权限，外部无法直接取）
      - name: Upload the core-ui build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ui-build-log
          path: ${{ runner.temp }}/core-ui-build.log
          if-no-files-found: warn

      - name: Verify core-ui.dll is a Windows x86-64 image
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'core-ui\clang-cl-build\core-ui.dll'
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "core-ui.dll was not produced at $dll"
          }
          $bytes = [IO.File]::ReadAllBytes($dll)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([Text.Encoding]::ASCII.GetString($bytes, $pe, 4) -ne "PE`0`0") {
            throw 'core-ui.dll is not a valid PE image'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) {
            throw ("core-ui.dll is not x86-64 (Machine=0x{0:X4}, expected 0x8664)" -f $machine)
          }
          Write-Host ("core-ui.dll OK: {0} bytes, Machine=0x8664" -f (Get-Item -LiteralPath $dll).Length)

      # 门禁 G2：产物版本必须与钉住的 revision 对应（core-ui/VERSION ↔ DLL 版本资源）
      - name: Gate G2 — the DLL version must match the pinned revision
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'core-ui\clang-cl-build\core-ui.dll'
          $expected = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'core-ui\VERSION') -Raw).Trim()
          $actual = (Get-Item -LiteralPath $dll).VersionInfo.FileVersion
          if (-not $actual) { throw 'core-ui.dll carries no FileVersion resource' }
          $actual = $actual.Trim()
          Write-Host "expected VERSION : $expected"
          Write-Host "actual FileVersion: $actual"
          if ($actual -ne $expected) {
            throw "core-ui.dll version mismatch: built $actual but the pinned revision declares $expected"
          }
          # 写 revision 戳记，随包分发，供运行时自证「手边这份就是 CI 构建的那份」
          $stamp = "$expected`n${{ steps.dependency.outputs.revision }}"
          Set-Content -LiteralPath "$dll.revision" -Value $stamp -Encoding utf8
          Write-Host "wrote $dll.revision"

      # 门禁 S7：机器判定 CRT 必须是动态（/MD）—— 必须出现 MSVCP140.dll 与 VCRUNTIME140.dll
      - name: Gate S7 — core-ui.dll must link the dynamic VC++ runtime
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'core-ui\clang-cl-build\core-ui.dll'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ x64 tools not found on the runner' }
          $dumpbin = Get-ChildItem -LiteralPath (Join-Path $installation 'VC\Tools\MSVC') -Recurse -Filter 'dumpbin.exe' -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe (x64) not found under the VS installation' }
          $deps = & $dumpbin.FullName /dependents $dll
          Write-Host ($deps -join "`n")
          foreach ($required in 'VCRUNTIME140.dll','MSVCP140.dll') {
            if (-not ($deps -match [regex]::Escape($required))) {
              throw "core-ui.dll does not depend on $required — the CRT mode is not the expected dynamic /MD"
            }
          }
          Write-Host 'Gate S7 passed: dynamic VC++ runtime confirmed.'

      - name: Upload core-ui.dll
        uses: actions/upload-artifact@v4
        with:
          name: core-ui-x64
          path: |
            core-ui/clang-cl-build/core-ui.dll
            core-ui/clang-cl-build/core-ui.dll.revision
          if-no-files-found: error

  # ==================================================================
  # package：便携 ZIP 组装（依赖前两个 job）
  # ==================================================================
  package:
    name: 便携包组装
    runs-on: windows-latest
    needs: [rust, core-ui]
    steps:
      - uses: actions/checkout@v7
        with:
          path: app

      - name: Download the executable
        uses: actions/download-artifact@v4
        with:
          name: zsdesk-app-full-x64
          path: app/target/release

      - name: Download core-ui.dll
        uses: actions/download-artifact@v4
        with:
          name: core-ui-x64
          path: app/target/release

      # 门禁 S12：core-ui.dll 必须与 exe 同目录，否则运行时可能命中 PATH 里的其它副本
      - name: Gate S12 — core-ui.dll must sit next to the executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'app\target\release\zsdesk-app.exe'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'app\target\release\core-ui.dll'
          if (-not (Test-Path -LiteralPath $exe)) { throw "executable not found at $exe" }
          if (-not (Test-Path -LiteralPath $dll)) { throw "core-ui.dll not found at $dll" }
          Write-Host 'Gate S12 passed: core-ui.dll is next to the executable.'

      - name: Collect the Visual C++ x64 Redistributable
        id: crt
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ x64 tools not found on the runner' }
          $redistRoot = Join-Path $installation 'VC\Redist\MSVC'
          $crtDir = $null
          foreach ($versionDir in (Get-ChildItem -LiteralPath $redistRoot -Directory -ErrorAction SilentlyContinue |
                                   Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
                                   Sort-Object { [version]$_.Name } -Descending |
                                   ForEach-Object { Join-Path $_.FullName 'x64' })) {
            $dir = Get-ChildItem -LiteralPath $versionDir -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue |
                   Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'msvcp140.dll') } |
                   Select-Object -First 1
            if ($dir) { $crtDir = $dir.FullName; break }
          }
          if (-not $crtDir) { throw 'Visual C++ x64 Redistributable directory not found' }
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $crtDir $dll))) { throw "missing CRT runtime: $dll" }
          }
          "dir=$crtDir" >> $env:GITHUB_OUTPUT
          Write-Host "CRT dir: $crtDir"

      - name: Package the portable x64 zip
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content -LiteralPath 'app/Cargo.toml' -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          $stage  = Join-Path $env:GITHUB_WORKSPACE "stage/ZSDesk-$version-full-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'app\target\release\zsdesk-app.exe') -Destination (Join-Path $stage 'ZSDesk.exe')
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'app\target\release\core-ui.dll')       -Destination (Join-Path $stage 'core-ui.dll')
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'app\target\release\core-ui.dll.revision')) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'app\target\release\core-ui.dll.revision') -Destination (Join-Path $stage 'core-ui.dll.revision')
          }

          # assets/ 必须进包：core-ui 没有运行时替换 CSS 变量的 C API，
          # Rust 必须在加载前把 :root 拼进 .uix 源码 → 用 ui_page_load_string → 运行时读文件。
          # 缺了 assets/，交付的 exe 启动即失败。
          $assets = Join-Path $env:GITHUB_WORKSPACE 'app\assets'
          if (-not (Test-Path -LiteralPath $assets)) { throw "assets directory not found at $assets" }
          Copy-Item -LiteralPath $assets -Destination (Join-Path $stage 'assets') -Recurse
          foreach ($required in 'main.uix','preview.uix','about.uix','themes.json') {
            $f = Join-Path $stage "assets\$required"
            if (-not (Test-Path -LiteralPath $f)) { throw "assets/$required is missing from the package" }
          }
          Write-Host 'assets/ packaged and verified.'

          $crtDir = '${{ steps.crt.outputs.dir }}'
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item -LiteralPath (Join-Path $crtDir $dll) -Destination (Join-Path $stage $dll)
          }

          Copy-Item -LiteralPath 'app/LICENSE' -Destination (Join-Path $stage 'LICENSE')
          if (Test-Path -LiteralPath 'app/THIRD-PARTY-NOTICES.txt') {
            Copy-Item -LiteralPath 'app/THIRD-PARTY-NOTICES.txt' -Destination (Join-Path $stage 'THIRD-PARTY-NOTICES.txt')
          }
          New-Item -ItemType Directory -Path (Join-Path $stage 'licenses') -Force | Out-Null
          if (Test-Path -LiteralPath 'app/packaging/licenses') {
            Copy-Item -Path 'app/packaging/licenses/*.txt' -Destination (Join-Path $stage 'licenses') -ErrorAction SilentlyContinue
          }

          # 已知风险：exe 同目录的 msvcp140.dll 会优先于系统目录，可能覆盖用户更新的版本 → 记版本号
          $note = @(
            '本包内附的 MSVC v14 运行库（msvcp140.dll / vcruntime140.dll / vcruntime140_1.dll）',
            '来自 Visual C++ x64 Redistributable，随包分发以实现「解压即用」。',
            '同目录的运行库会优先于系统目录；若遇到运行库相关的异常，请安装最新的 VC++ x64 运行库。',
            '各 DLL 的文件版本见 manifest.sha256 末列。'
          )
          Set-Content -LiteralPath (Join-Path $stage '说明.txt') -Value $note -Encoding utf8

          # 逐文件 bytes + SHA-256 manifest（沿用上游 package.ps1 的清单口径）
          $manifest = Join-Path $stage 'manifest.sha256'
          $lines = New-Object System.Collections.Generic.List[string]
          foreach ($f in (Get-ChildItem -LiteralPath $stage -Recurse -File | Sort-Object FullName)) {
            if ($f.FullName -eq $manifest) { continue }
            $hash = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $rel  = $f.FullName.Substring($stage.Length + 1).Replace('\','/')
            $ver  = $f.VersionInfo.FileVersion
            $lines.Add("$hash  $rel  $($f.Length)  $ver")
          }
          Set-Content -LiteralPath $manifest -Value $lines -Encoding utf8

          $zip = Join-Path $env:GITHUB_WORKSPACE "ZSDesk-$version-full-x64.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "package: $zip"
          Get-Item -LiteralPath $zip | ForEach-Object { Write-Host ("size: {0} bytes" -f $_.Length) }

      - name: Upload the portable package
        uses: actions/upload-artifact@v4
        with:
          name: ZSDesk-full-x64
          path: ZSDesk-*-full-x64.zip
          if-no-files-found: error
